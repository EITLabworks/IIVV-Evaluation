name: iivv-revision
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11
  - "numpy>=1.26,<3"
  - "scipy>=1.11,<2"
  - "scikit-learn>=1.7,<1.8"
  - "pandas>=2.1,<3"
  - "matplotlib>=3.8,<4"
  - "pillow>=10,<13"
  - "joblib>=1.3,<2"
  - "threadpoolctl>=3.2,<4"
  - "pytest>=8,<10"
  - "h5py>=3.11,<4"
  - jupyterlab
  - ipykernel
  - make
variables:
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
